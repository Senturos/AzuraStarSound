name: Build AzuraStarSound DLL

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release

      - name: Collect DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Recurse -Filter AzuraStarSound.dll | Select-Object -First 1
          if (-not $dll) { throw "AzuraStarSound.dll was not produced" }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $dll.FullName artifact/AzuraStarSound.dll

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: AzuraStarSound
          path: artifact/AzuraStarSound.dll
