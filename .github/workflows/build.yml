name: Build AzuraStarSound DLL

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get CommonLibSSE-NG
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path lib | Out-Null
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/CharmedBaryon/CommonLibSSE-NG.git lib/commonlibsse-ng

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Build DLL
        shell: pwsh
        run: |
          xmake f -m release -y
          xmake -y

      - name: Collect DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Recurse -Filter AzuraStarSound.dll | Select-Object -First 1
          if (-not $dll) { throw "AzuraStarSound.dll was not produced" }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $dll.FullName artifact/AzuraStarSound.dll

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: AzuraStarSound
          path: artifact/AzuraStarSound.dll
